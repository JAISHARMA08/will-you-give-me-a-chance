<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sanjvi ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.8), transparent 22%),
        radial-gradient(circle at 80% 30%, rgba(255,180,220,.7), transparent 25%),
        linear-gradient(135deg, #ffb6cf 0%, #e8b7f0 45%, #8c78c9 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #76143e;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)),
        radial-gradient(circle at 50% 100%, rgba(255,255,255,.35), transparent 45%);
    pointer-events: none;
}

.card {
    position: relative;
    width: min(92%, 560px);
    min-height: 590px;
    padding: 45px 28px 35px;
    border-radius: 38px;
    text-align: center;
    background: rgba(255,255,255,.82);
    border: 1px solid rgba(255,255,255,.8);
    box-shadow:
        0 30px 80px rgba(75,20,70,.30),
        inset 0 1px 0 white;
    backdrop-filter: blur(18px);
    z-index: 5;
    animation: cardIn 1s ease;
}

.top-line {
    font-size: 14px;
    color: #9a4165;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
}

.heart-main {
    font-size: 65px;
    display: inline-block;
    filter: drop-shadow(0 8px 12px rgba(220,40,100,.25));
    animation: heartbeat 1.4s infinite;
}

h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(32px, 8vw, 48px);
    line-height: 1.25;
    margin: 12px 0 10px;
    color: #a30d48;
}

.question {
    font-size: 20px;
    font-weight: 600;
    color: #721d42;
    margin: 0 0 18px;
}

#message {
    min-height: 34px;
    font-size: 18px;
    font-weight: 600;
    color: #d12665;
    transition: .25s;
}

.button-area {
    position: relative;
    height: 190px;
    margin-top: 12px;
}

button {
    border: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    cursor: pointer;
    border-radius: 999px;
    transition: transform .3s ease, box-shadow .3s ease, left .25s ease, top .25s ease;
    touch-action: manipulation;
}

#yes {
    position: absolute;
    left: 30%;
    top: 52%;
    transform: translate(-50%, -50%) scale(1);
    padding: 18px 40px;
    font-size: 22px;
    color: white;
    background: linear-gradient(135deg, #ff3f76, #e20c59);
    box-shadow:
        0 12px 30px rgba(225,20,90,.35),
        0 0 25px rgba(255,80,140,.35);
    z-index: 2;
}

#yes:hover {
    box-shadow:
        0 15px 35px rgba(225,20,90,.45),
        0 0 35px rgba(255,80,140,.5);
}

#no {
    position: absolute;
    left: 72%;
    top: 52%;
    transform: translate(-50%, -50%) scale(1);
    padding: 15px 30px;
    font-size: 18px;
    color: #6f5963;
    background: rgba(255,255,255,.95);
    box-shadow: 0 10px 25px rgba(80,30,50,.15);
    z-index: 3;
}

.bottom-text {
    color: #a14e70;
    font-size: 14px;
    margin-top: 5px;
}

.success {
    display: none;
    animation: successIn 1s cubic-bezier(.2,.8,.2,1);
}

.success-heart {
    font-size: 85px;
    animation: successHeart 1.2s infinite;
}

.success h2 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(34px, 9vw, 52px);
    color: #a30d48;
    margin: 15px 0;
}

.success p {
    font-size: 20px;
    line-height: 1.6;
    color: #7c3151;
}

.signature {
    margin-top: 22px;
    font-family: 'Pacifico', cursive;
    font-size: 24px;
    color: #d12665;
}

.floating-heart {
    position: fixed;
    bottom: -60px;
    z-index: 1;
    pointer-events: none;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 4px 8px rgba(150,20,80,.18));
}

.sparkle {
    position: fixed;
    color: white;
    z-index: 2;
    pointer-events: none;
    animation: sparkle 2s ease-in-out infinite;
}

.petal {
    position: fixed;
    top: -30px;
    z-index: 1;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg) scale(.7);
        opacity: 0;
    }
    10% { opacity: 1; }
    to {
        transform: translateY(-115vh) rotate(35deg) scale(1.2);
        opacity: 0;
    }
}

@keyframes fall {
    to {
        transform: translateY(115vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes sparkle {
    0%,100% { opacity: .2; transform: scale(.5); }
    50% { opacity: 1; transform: scale(1.3); }
}

@keyframes heartbeat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.13); }
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(25px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes successIn {
    from {
        opacity: 0;
        transform: scale(.65) rotate(-3deg);
    }
    60% {
        transform: scale(1.04) rotate(1deg);
    }
    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

@keyframes successHeart {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

@media (max-width: 480px) {
    .card {
        min-height: 560px;
        padding: 35px 20px;
    }

    .question {
        font-size: 17px;
    }

    .button-area {
        height: 190px;
    }

    #yes {
        left: 28%;
        padding: 16px 30px;
    }

    #no {
        left: 72%;
        padding: 13px 24px;
    }
}
</style>
</head>

<body>

<!-- Main question -->
<div class="card" id="mainCard">

    <div class="top-line">A little question for someone very special...</div>

    <div class="heart-main">❤️</div>

    <h1>Sanjvi,</h1>

    <div class="question">
        Will you give me a chance? 🥺❤️
    </div>

    <div id="message">
        Just one little chance... ❤️
    </div>

    <div class="button-area" id="buttonArea">
        <button id="yes">YES ❤️</button>
        <button id="no">NO 🙈</button>
    </div>

    <div class="bottom-text">
        Please think carefully... 👀💕
    </div>
</div>


<!-- Success screen -->
<div class="card success" id="successCard">

    <div class="success-heart">💖</div>

    <h2>Sanjvi said YES! ❤️</h2>

    <p>
        I knew you would give me a chance... 🥹❤️
        <br>
        Thank you for being you. 💕
    </p>

    <div class="signature">
        This means a lot to me ❤️
    </div>

    <div style="font-size:48px; margin-top:20px;">
        🥰 💕 🫶
    </div>
</div>


<script>

const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const buttonArea = document.getElementById("buttonArea");
const message = document.getElementById("message");

const mainCard = document.getElementById("mainCard");
const successCard = document.getElementById("successCard");

let noClicks = 0;
let noScale = 1;
let yesScale = 1;

const messages = [
    "Plzz na Sanjvi 🥺 ek chance de do ❤️",
    "Pleaseee 😭 soch lo ek baar",
    "Bas ek chance Sanjvi ❤️",
    "Please yaar 🥺👉👈",
    "Itna bhi kya gussa 😭❤️",
    "Ek baar YES kar do 🥹",
    "Please don't say NO 😭❤️",
    "Bas ek chance de do na Sanjvi 🥺",
    "Last chance... pleaseee 🥹❤️",
    "No mat karo naaa 😭❤️"
];

const noTexts = [
    "NO 🙈",
    "Are you sure? 🥺",
    "Really? 😭",
    "Think again 😭",
    "Please? 🥺",
    "Nooo 😭",
    "Why Sanjvi? 🥹",
    "Please 🥺",
    "NO 😭"
];

function moveNoButton() {

    noClicks++;

    message.textContent =
        messages[Math.min(noClicks - 1, messages.length - 1)];

    noButton.textContent =
        noTexts[Math.min(noClicks - 1, noTexts.length - 1)];

    noScale = Math.max(.28, noScale - .09);
    yesScale = Math.min(1.65, yesScale + .11);

    yesButton.style.transform =
        `translate(-50%, -50%) scale(${yesScale})`;

    const areaWidth = buttonArea.clientWidth;
    const areaHeight = buttonArea.clientHeight;

    const x = Math.random() * (areaWidth - 70) + 35;
    const y = Math.random() * (areaHeight - 60) + 30;

    noButton.style.left = x + "px";
    noButton.style.top = y + "px";

    noButton.style.transform =
        `translate(-50%, -50%) scale(${noScale})`;
}

noButton.addEventListener("mouseenter", moveNoButton);

noButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveNoButton();
}, { passive: false });

noButton.addEventListener("click", function(e) {
    e.preventDefault();
    moveNoButton();
});

yesButton.addEventListener("click", function() {

    // Hide question
    mainCard.style.display = "none";

    // Show celebration
    successCard.style.display = "block";

    // Big burst of hearts
    for (let i = 0; i < 35; i++) {
        setTimeout(createHeart, i * 45);
    }

    // Falling petals
    for (let i = 0; i < 20; i++) {
        setTimeout(createPetal, i * 70);
    }
});


// Floating hearts in background
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    const hearts = ["❤️", "💖", "💕", "💗", "💓", "💞"];

    heart.textContent =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 30) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 6) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 12000);
}


// Sparkles
function createSparkle() {

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";
    sparkle.textContent = "✦";

    sparkle.style.left =
        Math.random() * 100 + "vw";

    sparkle.style.top =
        Math.random() * 100 + "vh";

    sparkle.style.fontSize =
        (10 + Math.random() * 18) + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 2200);
}


// Falling petals
function createPetal() {

    const petal = document.createElement("div");

    petal.className = "petal";
    petal.textContent = "🌸";

    petal.style.left =
        Math.random() * 100 + "vw";

    petal.style.fontSize =
        (14 + Math.random() * 18) + "px";

    petal.style.animationDuration =
        (4 + Math.random() * 4) + "s";

    document.body.appendChild(petal);

    setTimeout(() => petal.remove(), 9000);
}


// Keep background alive
setInterval(createHeart, 700);
setInterval(createSparkle, 500);
setInterval(createPetal, 1400);

</script>

</body>
</html>
